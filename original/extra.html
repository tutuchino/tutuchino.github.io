<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進階詞彙閃卡 · Tutu</title>
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  :root {
    --bg:#e9dfd0; --text:#3d2b1f; --front1:#fbf7f0; --front2:#f2ead9; --back:#fffdf8;
    --accent:#8a6d3b; --mid:#8b7355; --light:#b0a088; --soft:#f5eee2; --line:#d8c9ad;
    --example-bg:#f1eadf; --btn-bg:#fff; --flip-bg:#3d2b1f; --flip-fg:#fff;
    --shadow:rgba(61,43,31,0.15); --ok:#2e7d32; --ok-bg:#e3f0e4;
  }
  body.dark {
    --bg:#2b2722; --text:#e9e2d5; --front1:#3a352f; --front2:#322e29; --back:#2f2c28;
    --accent:#c9a86a; --mid:#b5a68f; --light:#7d715f; --soft:#37332d; --line:#544e46;
    --example-bg:#3a352e; --btn-bg:#3a352f; --flip-bg:#e9e2d5; --flip-fg:#2b2722;
    --shadow:rgba(0,0,0,0.35); --ok:#7bc67e; --ok-bg:#2c3a2d;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Noto Sans SC','Noto Serif SC',sans-serif; background:var(--bg); color:var(--text); padding:16px; max-width:520px; margin:0 auto; padding-bottom:60px; }
  .top-bar { display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .top-title { font-family:'Noto Serif SC',serif; font-size:20px; font-weight:900; letter-spacing:1px; }
  .top-btn { background:var(--btn-bg); border:1.5px solid var(--accent); color:var(--accent); border-radius:24px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer; }
  .mod-select { flex:1; min-width:140px; background:var(--btn-bg); border:1.5px solid var(--accent); color:var(--text); border-radius:24px; padding:7px 12px; font-size:13px; font-weight:700; outline:none; }
  .search-row { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .search-input { flex:1; min-width:130px; background:var(--btn-bg); border:1px solid var(--line); border-radius:20px; padding:8px 14px; font-size:13px; color:var(--text); outline:none; }
  .mark-dot { margin-left:auto; font-size:13px; color:var(--mid); }
  .card-meta { display:flex; gap:10px; align-items:center; margin-bottom:12px; }
  .card-no { font-family:'Noto Serif SC',serif; font-size:15px; font-weight:700; }
  .flip-card { width:100%; height:460px; perspective:1200px; margin-bottom:12px; }
  .flip-inner { position:relative; width:100%; height:100%; transition:transform .6s; transform-style:preserve-3d; }
  .flip-inner.flipped { transform:rotateY(180deg); }
  .card-face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:18px; padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow-y:auto; }
  .card-front { background:linear-gradient(135deg,var(--front1),var(--front2)); box-shadow:0 8px 24px var(--shadow); }
  .card-back { background:var(--back); box-shadow:0 8px 24px var(--shadow); transform:rotateY(180deg); justify-content:flex-start; padding-top:24px; }
  .word-big { font-family:'Noto Serif SC',serif; font-size:40px; font-weight:900; line-height:1.2; text-align:center; }
  .word-py { font-size:20px; color:var(--mid); margin-top:8px; }
  .speak-btn { display:inline-flex; align-items:center; gap:6px; background:var(--btn-bg); border:1.5px solid var(--line); border-radius:24px; padding:8px 16px; font-size:13px; font-weight:600; color:var(--accent); cursor:pointer; margin-top:12px; }
  .speak-btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  .speak-btn svg { width:15px; height:15px; fill:currentColor; }
  .hint { font-size:12px; color:var(--light); margin-top:10px; }
  .back-word { font-family:'Noto Serif SC',serif; font-size:28px; font-weight:900; text-align:center; }
  .back-py { font-size:15px; color:var(--mid); text-align:center; margin-top:4px; }
  .lv-badge { font-size:12px; font-weight:700; color:#fff; background:var(--accent); border-radius:999px; padding:2px 12px; display:inline-block; margin-top:8px; }
  .back-es { font-size:17px; text-align:center; margin-top:14px; line-height:1.5; }
  .back-divider { width:60%; height:1px; background:var(--line); margin:14px 0; }
  .back-ex-cn { font-size:16px; color:var(--accent); font-weight:700; text-align:center; line-height:1.6; }
  .back-ex-py { font-size:13px; color:var(--mid); text-align:center; margin-top:6px; line-height:1.5; }
  .back-ex-es { font-size:14px; color:var(--mid); text-align:center; margin-top:6px; line-height:1.5; }
  .back-note { font-size:12px; color:var(--light); text-align:center; margin-top:12px; line-height:1.5; }
  .mark-row { display:flex; gap:10px; margin-bottom:12px; }
  .mark-row button { flex:1; background:var(--btn-bg); border:1.5px solid var(--line); border-radius:14px; padding:11px 0; font-size:14px; font-weight:700; color:var(--text); cursor:pointer; }
  .mark-row button.on { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .nav-row { display:flex; gap:10px; }
  .nav-row button { flex:1; background:var(--accent); color:#fff; border:none; border-radius:14px; padding:12px 0; font-size:15px; font-weight:700; cursor:pointer; }
  .empty-note { font-size:13px; color:var(--mid); padding:10px 0; text-align:center; }
  .srs-row { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; justify-content:center; }
  .srs-btn { flex:1; min-width:60px; padding:10px 4px; border-radius:12px; border:1.5px solid var(--line); background:var(--btn-bg); color:var(--text); font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; line-height:1.3; }
  .srs-btn.again { border-color:#c0392b; color:#c0392b; }
  .srs-btn.hard  { border-color:#d97706; color:#d97706; }
  .srs-btn.good  { border-color:#2e7d32; color:#2e7d32; }
  .srs-btn.easy  { border-color:#1e6091; color:#1e6091; }
  .srs-btn:hover { filter:brightness(0.95); }
  .srs-custom { display:flex; gap:4px; justify-content:center; flex-wrap:wrap; margin-bottom:10px; }
  .srs-custom button { padding:5px 10px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--mid); font-size:11px; cursor:pointer; font-family:inherit; }
  .srs-custom button:hover { background:var(--soft); color:var(--accent); }
  .srs-toast { position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--text); color:var(--front1); padding:10px 18px; border-radius:24px; font-size:13px; font-weight:600; box-shadow:0 6px 18px var(--shadow); opacity:0; transition:opacity .25s; z-index:99; pointer-events:none; white-space:nowrap; }
  .srs-toast.show { opacity:1; }
  .back-meta { margin-top:12px; font-size:11px; color:var(--mid); min-height:14px; text-align:center; }
  .srs-search-block { margin-bottom:12px; }
  .srs-mini { background:var(--btn-bg); border:1px solid var(--line); color:var(--mid); border-radius:10px; padding:5px 12px; font-size:12px; cursor:pointer; }
  .srs-cal-head { display:flex; align-items:center; gap:8px; margin:8px 0; }
  .srs-cal-title { flex:1; text-align:center; font-weight:700; font-size:14px; }
  .srs-cal-week { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--mid); margin-bottom:4px; }
  .srs-cal-body { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .srs-cal-empty { height:32px; }
  .srs-cal-day { height:32px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:8px; background:var(--btn-bg); border:1px solid var(--line); font-size:12px; cursor:pointer; position:relative; }
  .srs-cal-day.today { border-color:var(--accent); }
  .srs-cal-day.picked { background:var(--accent); color:#fff; }
  .srs-cal-day .n { font-size:9px; color:#c0392b; font-weight:700; line-height:1; }
  .srs-cal-day.picked .n { color:#fff; }
  .teacher-panel { background:var(--soft); border:1.5px solid var(--accent); border-radius:14px; padding:14px; margin-bottom:14px; }
  .teacher-panel h3 { font-size:14px; margin-bottom:8px; color:var(--accent); }
  .t-mod-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:8px 0; }
  .t-mod-grid label { background:var(--btn-bg); border:1px solid var(--line); border-radius:10px; padding:8px; font-size:12px; cursor:pointer; }
  .t-inp { width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--btn-bg); color:var(--text); margin:6px 0; font-size:13px; }
  .t-save-btn { width:100%; padding:11px; background:var(--accent); color:#fff; border:none; border-radius:10px; font-weight:700; cursor:pointer; }
  .t-stat { font-size:12px; color:var(--mid); margin-top:6px; }
  .empty-note-big { font-size:14px; color:var(--mid); text-align:center; padding:40px 10px; line-height:1.7; }
  .footer { text-align:center; padding:20px 0 10px; font-size:11px; color:var(--light); }
</style>
</head>
<body>

<div class="top-bar">
  <a class="tb" href="../index.html" title="Volver a HOME" style="background:var(--btn-bg);border:1.5px solid var(--accent);color:var(--accent);border-radius:24px;padding:7px 14px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;">⌂ HOME</a>
  <div class="top-title">詞彙進階</div>
  <select class="mod-select" id="modSelect"></select>
  <button class="top-btn" id="srsSearchToggleBtn">📅</button>
  <button class="top-btn" id="darkBtn">◐</button>
</div>

<div class="srs-search-block" id="srsSearchBlock" style="display:none;">
  <div class="srs-cal-head">
    <button class="srs-mini" onclick="srsPrevMonth()">‹</button>
    <div class="srs-cal-title" id="srsCalTitle"></div>
    <button class="srs-mini" onclick="srsNextMonth()">›</button>
    <button class="srs-mini" onclick="srsGoToday()">Hoy</button>
  </div>
  <div class="srs-cal-week"><span>lun</span><span>mar</span><span>mié</span><span>jue</span><span>vie</span><span>sáb</span><span>dom</span></div>
  <div class="srs-cal-body" id="srsCalBody"></div>
  <div class="back-meta" id="srsDateResult"></div>
</div>

<div class="teacher-panel" id="teacherPanel" style="display:none;">
  <h3>🎓 發放模組</h3>
  <div class="t-stat" id="tpModName">—</div>
  <label style="display:block;padding:11px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;font-size:13px;cursor:pointer;">
    <input type="checkbox" id="tpOpenMod" style="width:17px;height:17px;accent-color:var(--accent);vertical-align:middle;margin-right:6px;"> 開放此模組給 <b id="tpStudentName">學生</b>
  </label>
  <button class="t-save-btn" id="saveModBtn">✓ 儲存雲端</button>
  <div class="t-stat" id="exportStat"></div>
</div>

<div class="search-row">
  <input class="search-input" id="searchInput" placeholder="搜尋：中文 / 拼音 / 西語">
  <button class="top-btn" id="hideLearnedBtn">隱藏已學</button>
</div>

<div class="card-meta">
  <span class="card-no" id="cardNo">#001</span>
  <span class="mark-dot" id="markDot"></span>
</div>

<div class="flip-card" id="cardBox">
  <div class="flip-inner" id="flipInner">
    <div class="card-face card-front">
      <div class="word-big" id="frontWord">詞</div>
      <div class="word-py" id="frontPy"></div>
      <button class="speak-btn" id="speakFrontBtn"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>朗讀</button>
      <div class="hint">點擊翻面</div>
    </div>
    <div class="card-face card-back">
      <div class="back-word" id="backWord"></div>
      <div class="back-py" id="backPy"></div>
      <div class="lv-badge" id="backLv" style="display:none;"></div>
      <div class="back-es" id="backEs"></div>
      <div class="back-divider"></div>
      <div class="back-ex-cn" id="backEx"></div>
      <div class="back-ex-py" id="backExPy"></div>
      <div class="back-ex-es" id="backExEs"></div>
      <div class="back-ex-cn" id="backEx2" style="display:none;"></div>
      <div class="back-ex-py" id="backEx2Py" style="display:none;"></div>
      <div class="back-ex-es" id="backEx2Es" style="display:none;"></div>
      <div class="back-note" id="backNote" style="display:none;"></div>
      <div class="back-meta" id="lastReviewed"></div>
      <button class="speak-btn" id="speakBackBtn"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>讀例句</button>
    </div>
  </div>
</div>

<div id="srsRow" style="display:none;">
  <div class="srs-row">
    <button class="srs-btn again" onclick="srsRate('again')">Olvidado<br><small>1 día</small></button>
    <button class="srs-btn hard"  onclick="srsRate('hard')">Difícil<br><small>2 días</small></button>
    <button class="srs-btn good"  onclick="srsRate('good')">Bien<br><small>Según plan</small></button>
    <button class="srs-btn easy"  onclick="srsRate('easy')">Fácil<br><small>+30%</small></button>
  </div>
  <div class="srs-custom">
    <button onclick="srsCustom(1)">Mañana</button>
    <button onclick="srsCustom(3)">3 días</button>
    <button onclick="srsCustom(7)">1 semana</button>
    <button onclick="srsCustom(30)">1 mes</button>
    <button onclick="srsCustom(60)">2 meses</button>
  </div>
</div>

<div class="mark-row" id="learnedRow">
  <button id="markLearnedBtn">已學會</button>
</div>
<div class="nav-row">
  <button id="prevBtn">上一張</button>
  <button id="nextBtn">下一張</button>
</div>

<div class="srs-toast" id="srsToast"></div>
<div class="footer">Chino Básico por Tema</div>

<script>

: "他这样做跟目标南辕北辙。", "examplePinyin": "tā zhè yàng zuò gēn mù biāo nán yuán běi zhé.", "exampleEs": "Lo que hace va en dirección contraria a su meta.", "note": "比喻行动与目的相反。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C128", "word": "难能可贵", "pinyin": "nán néng kě guì", "es": "algo difícil de lograr, valioso", "example": "他能坚持十年，难能可贵。", "examplePinyin": "tā néng jiān chí shí nián, nán néng kě guì.", "exampleEs": "Persistir diez años es difícil y valioso.", "note": "形容不容易做到的事做到了，很可贵。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C129", "word": "弄巧成拙", "pinyin": "nòng qiǎo chéng zhuō", "es": "estropear algo por querer mejorarlo", "example": "他本想帮忙，结果弄巧成拙。", "examplePinyin": "tā běn xiǎng bāng máng, jié guǒ nòng qiǎo chéng zhuō.", "exampleEs": "Quería ayudar, pero lo estropeó todo.", "note": "比喻想耍巧妙反而坏了事。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C130", "word": "怒发冲冠", "pinyin": "nù fà chōng guān", "es": "furioso hasta la raíz del pelo", "example": "听到诬陷，他怒发冲冠。", "examplePinyin": "tīng dào wū xiàn, tā nù fà chōng guān.", "exampleEs": "Ante la calumnia, se puso furioso.", "note": "形容极度愤怒。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C131", "word": "拍案而起", "pinyin": "pāi àn ér qǐ", "es": "levantarse indignado, golpeando la mesa", "example": "他拍案而起，大声抗议。", "examplePinyin": "tā pāi àn ér qǐ, dà shēng kàng yì.", "exampleEs": "Golpeó la mesa y se levantó a protestar.", "note": "形容愤怒得拍桌子站起来。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C132", "word": "披荆斩棘", "pinyin": "pī jīng zhǎn jí", "es": "abrirse paso entre dificultades", "example": "创业之路要披荆斩棘。", "examplePinyin": "chuàng yè zhī lù yào pī jīng zhǎn jí.", "exampleEs": "Emprender exige abrirse paso entre dificultades.", "note": "比喻扫除障碍，克服困难。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C133", "word": "匹夫之勇", "pinyin": "pǐ fū zhī yǒng", "es": "valor ciego, sin estrategia", "example": "打仗不能靠匹夫之勇。", "examplePinyin": "dǎ zhàng bù néng kào pǐ fū zhī yǒng.", "exampleEs": "En la guerra no basta el valor ciego.", "note": "比喻只有勇气而没有智谋。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C134", "word": "破釜沉舟", "pinyin": "pò fǔ chén zhōu", "es": "quemarse los barcos, sin retorno", "example": "我们破釜沉舟，决一死战。", "examplePinyin": "wǒ men pò fǔ chén zhōu, jué yī sǐ zhàn.", "exampleEs": "Nos quemamos los barcos; será a vida o muerte.", "note": "比喻下定决心，义无反顾。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C135", "word": "扑朔迷离", "pinyin": "pū shuò mí lí", "es": "difícil de entender, confuso", "example": "案情扑朔迷离。", "examplePinyin": "àn qíng pū shuò mí lí.", "exampleEs": "El caso es confuso y difícil de entender.", "note": "形容事情错综复杂，难以辨清。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C136", "word": "气吞山河", "pinyin": "qì tūn shān hé", "es": "ambición descomunal, imponente", "example": "他有气吞山河的气势。", "examplePinyin": "tā yǒu qì tūn shān hé de qì shì.", "exampleEs": "Tiene una ambición imponente.", "note": "形容气魄很大。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C137", "word": "千钧一发", "pinyin": "qiān jūn yī fà", "es": "situación desesperada, por un pelo", "example": "在千钧一发之际，他跳开了。", "examplePinyin": "zài qiān jūn yī fà zhī jì, tā tiào kāi le.", "exampleEs": "En el momento crítico, saltó a un lado.", "note": "比喻极其危急的时刻。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C138", "word": "千篇一律", "pinyin": "qiān piān yī lǜ", "es": "todo igual, monótono", "example": "这些文章千篇一律。", "examplePinyin": "zhè xiē wén zhāng qiān piān yī lǜ.", "exampleEs": "Estos artículos son todos iguales.", "note": "形容文章或事物千篇一律。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C139", "word": "前功尽弃", "pinyin": "qián gōng jìn qì", "es": "perder todo lo ganado hasta ahora", "example": "最后一刻失败，前功尽弃。", "examplePinyin": "zuì hòu yī kè shī bài, qián gōng jìn qì.", "exampleEs": "Fracasó al final y perdió todo lo ganado.", "note": "比喻以前的努力全部白费。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C140", "word": "前车之鉴", "pinyin": "qián chē zhī jiàn", "es": "lección de errores pasados", "example": "我们要吸取前车之鉴。", "examplePin s.", "note": "比喻强者得到助力更强。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C154", "word": "如获至宝", "pinyin": "rú huò zhì bǎo", "es": "como si hubieras encontrado un tesoro", "example": "他拿到这本书，如获至宝。", "examplePinyin": "tā ná dào zhè běn shū, rú huò zhì bǎo.", "exampleEs": "Al conseguir este libro, sintió que hallaba un tesoro.", "note": "比喻得到最珍贵的东西。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C155", "word": "如火如荼", "pinyin": "rú huǒ rú tú", "es": "con gran fuerza, en pleno apogeo", "example": "运动会进行得如火如荼。", "examplePinyin": "yùn dòng huì jìn xíng dé rú huǒ rú tú.", "exampleEs": "Los juegos deportivos están en pleno apogeo.", "note": "形容气势旺盛、热烈。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C156", "word": "如坐针毡", "pinyin": "rú zuò zhēn zhān", "es": "sentirse incómodo, sobre agujas", "example": "等待结果时他如坐针毡。", "examplePinyin": "děng dài jié guǒ shí tā rú zuò zhēn zhān.", "exampleEs": "Mientras esperaba el resultado, estaba sobre agujas.", "note": "形容心神不宁、坐立不安。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C157", "word": "入乡随俗", "pinyin": "rù xiāng suí sú", "es": "allá donde fueres haz lo que vieres", "example": "在国外要入乡随俗。", "examplePinyin": "zài guó wài yào rù xiāng suí sú.", "exampleEs": "En el extranjero hay que adaptarse a las costumbres.", "note": "比喻到什么地方顺从什么地方的风俗。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C158", "word": "三顾茅庐", "pinyin": "sān gù máo lú", "es": "visitar con mucha insistencia para convencer", "example": "老板三顾茅庐才请到他。", "examplePinyin": "lǎo bǎn sān gù máo lú cái qǐng dào tā.", "exampleEs": "El jefe lo visitó varias veces hasta convencerlo.", "note": "比喻诚心诚意一再邀请。", "image": "", "mod": "chengyu"}, {"id": "chengyu_C159", "word": "三人成虎", "pinyin": "sān rén chéng hǔ", "es": "si muchos repiten una mentira, se cree", "example": "谣言传多了，三人成虎。", "examplePinyin": "yáo yán chuán duō le, sān rén chéng hǔ.", "exampleEs": "Si muchos repiten el rumor, acaba creyéndose.", "note": "比喻谣言重复多次就信以为真。", "image": "", "mod": "chengyu"}, {"id": "chengyu n xí kě yǐ tí gāo shuǐ zhǔn.", "exampleEs": "Practicar mucho eleva el nivel.", "note": "「提高」表示上升。", "level": "L2", "image": "", "mod": "yufa"}, {"id": "yufa_G099", "word": "降低", "pinyin": "jiàng dī", "es": "reducir", "example": "降温了，温度降低了。", "examplePinyin": "jiàng wēn le, wēn dù jiàng dī le.", "exampleEs": "Hace más frío, la temperatura bajó.", "note": "「降低」表示下降。", "level": "L2", "image": "", "mod": "yufa"}, {"id": "yufa_G100", "word": "改善", "pinyin": "gǎi shàn", "es": "mejorar", "example": "我们改善了生活条件。", "examplePinyin": "wǒ men gǎi shàn le shēng huó tiáo jiàn.", "exampleEs": "Mejoramos las condiciones de vida.", "note": "「改善」表示变好。", "level": "L2", "image": "", "mod": "yufa"}];

let currentMod = null;
let cardList = [];
let currentIdx = 0;
let filteredList = [];
let showOnlyUnlearned = false;
let state = JSON.parse(localStorage.getItem('extraStore') || '{}');
if(!state.marks) state.marks = {};
state.lastIdx = state.lastIdx || 0;
if(!state.reviewQueue) state.reviewQueue = [];
function saveState(){ localStorage.setItem('extraStore', JSON.stringify(state)); }

function speak(text){
  if(!text) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=0.9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function fillModSelect(allowedMods){
  const sel = document.getElementById('modSelect');
  sel.innerHTML='';
  (allowedMods||MODS).forEach(m=>{
    const o=document.createElement('option');
    o.value=m.id; o.textContent=m.es+' ('+m.n+')';
    sel.appendChild(o);
  });
}
function setMod(modId){
  currentMod = modId;
  window.currentMod = modId;
  cardList = ALL_CARDS.filter(c=>c.mod===modId);
  filteredList=[...cardList];
  currentIdx=0;
  applyFilter();
}
function renderCard(){
  const box = document.getElementById('cardBox');
  if(filteredList.length===0){
    box.innerHTML='<div class="empty-note-big">這個模組還沒有卡片<br>或沒有可複習的卡片</div>';
    return;
  }
  const card = filteredList[currentIdx];
  document.getElementById('cardNo').textContent='#'+card.id;
  document.getElementById('frontWord').textContent=card.word;
  document.getElementById('frontPy').textContent=card.pinyin;
  document.getElementById('backWord').textContent=card.word;
  document.getElementById('backPy').textContent=card.pinyin;
  document.getElementById('backEs').textContent=card.es||'';
  document.getElementById('backEx').textContent=card.example||'';
  document.getElementById('backExPy').textContent=card.examplePinyin||'';
  document.getElementById('backExEs').textContent=card.exampleEs||'';
  const ex2=document.getElementById('backEx2');
  if(card.ex2){ ex2.textContent=card.ex2; ex2.style.display='block';
    document.getElementById('backEx2Py').textContent=card.ex2Py||''; document.getElementById('backEx2Py').style.display='block';
    document.getElementById('backEx2Es').textContent=card.ex2Es||''; document.getElementById('backEx2Es').style.display='block';
  } else { ex2.style.display='none';
    document.getElementById('backEx2Py').style.display='none';
    document.getElementById('backEx2Es').style.display='none';
  }
  const note=document.getElementById('backNote');
  if(card.note){ note.textContent=card.note; note.style.display='block'; } else note.style.display='none';
  const lv=document.getElementById('backLv');
  if(card.level){ lv.textContent=card.level; lv.style.display='inline-block'; } else lv.style.display='none';
  const markBtn=document.getElementById('markLearnedBtn');
  const dot=document.getElementById('markDot');
  if(state.marks[card.id]==='learned'){ markBtn.classList.add('on'); dot.textContent='✓ 已學'; }
  else { markBtn.classList.remove('on'); dot.textContent=''; }
  document.getElementById('flipInner').classList.remove('flipped');
  state.lastIdx=currentIdx; saveState();
}
function normPy(x){
  return (x||'').toLowerCase()
    .replace(/[\u0101\u00e1\u01ce\u00e0]/g,'a').replace(/[\u0113\u00e9\u011b\u00e8]/g,'e')
    .replace(/[\u012b\u00ed\u01d0\u00ec]/g,'i').replace(/[\u014d\u00f3\u01d2\u00f2]/g,'o')
    .replace(/[\u016b\u00fa\u01d4\u00f9]/g,'u').replace(/[\u01d6\u01d8\u01da\u01dc]/g,'\u00fc').replace(/\u00fc/g,'v')
    .replace(/[^a-zv]/g,'');
}

function applyFilter(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const isPy=/[a-z]/i.test(q);
  const nq=normPy(q);
  filteredList=cardList.filter(c=>{
    if(showOnlyUnlearned && state.marks[c.id]==='learned') return false;
    if(!q) return true;
    return (c.word&&c.word.toLowerCase().includes(q))||
      (c.pinyin&&(c.pinyin.toLowerCase().includes(q)||(isPy&&normPy(c.pinyin).includes(nq))))||
      (c.es&&c.es.toLowerCase().includes(q));
  });
  currentIdx=0; renderCard();
}
document.getElementById('cardBox').onclick=()=>document.getElementById('flipInner').classList.toggle('flipped');
document.getElementById('prevBtn').onclick=()=>{ if(currentIdx>0){currentIdx--;renderCard();} };
document.getElementById('nextBtn').onclick=()=>{ if(currentIdx<filteredList.length-1){currentIdx++;renderCard();} };
document.getElementById('markLearnedBtn').onclick=(e)=>{
  e.stopPropagation();
  const c=filteredList[currentIdx]; if(!c) return;
  if(state.marks[c.id]==='learned') delete state.marks[c.id]; else state.marks[c.id]='learned';
  saveState(); renderCard();
};
document.getElementById('hideLearnedBtn').onclick=()=>{
  showOnlyUnlearned=!showOnlyUnlearned;
  document.getElementById('hideLearnedBtn').classList.toggle('active');
  applyFilter();
};
document.getElementById('searchInput').oninput=applyFilter;
document.getElementById('modSelect').onchange=(e)=>setMod(e.target.value);
document.getElementById('darkBtn').onclick=()=>{
  document.body.classList.toggle('dark');
  localStorage.setItem('extra_dark', document.body.classList.contains('dark'));
};
document.getElementById('speakFrontBtn').onclick=(e)=>{ e.stopPropagation(); speak(filteredList[currentIdx]&&filteredList[currentIdx].word); };
document.getElementById('speakBackBtn').onclick=(e)=>{ e.stopPropagation(); speak(filteredList[currentIdx]&&filteredList[currentIdx].example); };
document.getElementById('srsSearchToggleBtn').onclick=()=>{
  const b=document.getElementById('srsSearchBlock');
  b.style.display=(b.style.display==='block')?'none':'block';
  if(b.style.display==='block') srsOpenCal();
};
if(localStorage.getItem('extra_dark')==='true') document.body.classList.add('dark');
document.addEventListener('contextmenu', e=>e.preventDefault());
window.state=state; window.renderCard=renderCard;
window.setMod=setMod; window.fillModSelect=fillModSelect; window.applyFilter=applyFilter;
const _uMod = new URLSearchParams(location.search).get('mod');
if(_uMod) window.setMod(_uMod);
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fb = initializeApp({
  apiKey: "AIzaSyC_C9Mj_xAXyVTcd34v1VfnffvgJMDMLm8",
  authDomain: "chino-basico-por-tema.firebaseapp.com",
  projectId: "chino-basico-por-tema",
  storageBucket: "chino-basico-por-tema.firebasestorage.app",
  messagingSenderId: "25772645467",
  appId: "1:25772645467:web:325ba09f8ec4d6b229737e"
});
const auth = getAuth(fb);
const db = getFirestore(fb);

const SRS = { email:null, cards:{}, loaded:false, reviewMode:false, busy:false };
const SRS_KEY = 'e_';
function todayDays(){ return Math.floor(Date.now()/86400000); }
function cardKey(c){ return SRS_KEY + c.id; }
window.cardKey = cardKey;

let visibleCards = [];
function refreshVisible(){
  if(window._allowedMods){ visibleCards = ALL_CARDS.filter(c => window._allowedMods.indexOf(c.mod)>=0); }
  else { visibleCards = ALL_CARDS.slice(); }
}
window.refreshVisible = refreshVisible;
refreshVisible();

async function srsLoad(email){
  SRS.email = email;
  try{
    const snap = await getDoc(doc(db,"srs",email));
    if(snap.exists() && snap.data().cards) SRS.cards = snap.data().cards;
  }catch(e){ console.warn("srs load fail",e); }
  SRS.loaded=true;
  srsMaybeAutoReview();
}
async function srsFlush(){
  if(!SRS.email) return;
  try{ await setDoc(doc(db,"srs",SRS.email), { cards:SRS.cards, updatedAt:new Date() }, { merge:true }); }
  catch(e){ console.warn("srs flush fail",e); }
}
const SRS_MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function srsFmtDate(days){
  const d=new Date(days*86400000);
  return d.getDate()+' '+(SRS_MESES[d.getMonth()]||'')+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');
}
function srsIntervalText(days){
  if(days<=1) return 'manana';
  if(days<30) return 'en '+days+' dias';
  if(days<60) return 'en 1 mes';
  return 'en '+Math.round(days/30)+' meses';
}
let _tt=null;
function srsToast(t){
  const el=document.getElementById('srsToast');
  el.textContent=t; el.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),1800);
}
function srsRate(grade){
  if(SRS.busy) return;
  const card=(window.state.reviewQueue||[])[window.state.cardIndex];
  if(!card) return;
  const key=cardKey(card);
  const today=todayDays();
  let item=SRS.cards[key]||{due:today,iv:0,ease:2.5,reps:0,lapses:0};
  if(grade==='again'){ item.reps=0; item.iv=1; item.ease=Math.max(1.3,item.ease-0.2); item.due=today+1; item.lapses=(item.lapses||0)+1; }
  else if(grade==='hard'){ item.reps++; item.iv=item.iv<=1?2:Math.round(item.iv*1.2); item.ease=Math.max(1.3,item.ease-0.15); item.due=today+item.iv; }
  else if(grade==='good'){ item.reps++; if(item.reps===1)item.iv=3; else if(item.reps===2)item.iv=7; else item.iv=Math.round(item.iv*item.ease); item.due=today+item.iv; }
  else if(grade==='easy'){ item.reps++; item.iv=item.iv<=1?4:Math.round(item.iv*item.ease*1.3); item.ease+=0.15; item.due=today+item.iv; }
  srsCommit(card,key,item,item.due-today);
}
function srsCustom(days){
  if(SRS.busy) return;
  const card=(window.state.reviewQueue||[])[window.state.cardIndex];
  if(!card) return;
  const key=cardKey(card);
  const today=todayDays();
  let item=SRS.cards[key]||{due:today,iv:0,ease:2.5,reps:0,lapses:0};
  item.due=today+days;
  if(days>(item.iv||0)){ item.iv=days; item.reps++; }
  srsCommit(card,key,item,days);
}
function srsCommit(card,key,item,days){
  item.lastReviewed=todayDays();
  SRS.cards[key]=item;
  srsFlush();
  srsToast('Volvera '+srsIntervalText(days)+' · '+srsFmtDate(item.due));
  document.getElementById('flipInner').classList.add('flipped');
  document.getElementById('lastReviewed').textContent='Ultima vez: '+srsFmtDate(item.lastReviewed)+' · Proxima: '+srsFmtDate(item.due);
  SRS.busy=true;
  setTimeout(()=>{
    SRS.busy=false;
    if(SRS.reviewMode){
      window.state.reviewQueue.splice(window.state.cardIndex,1);
      if(window.state.cardIndex>=window.state.reviewQueue.length) window.state.cardIndex=window.state.reviewQueue.length-1;
    } else {
      if(window.state.cardIndex<window.state.reviewQueue.length-1) window.state.cardIndex++;
    }
    window.renderCard();
  },1300);
}
function srsCountOn(d){
  let n=0;
  window.visibleCards.forEach(c=>{ const it=SRS.cards[cardKey(c)]; if(it&&it.due===d) n++; });
  return n;
}
function srsCardsDueOn(daysSet){
  const out=[];
  window.visibleCards.forEach(c=>{ const it=SRS.cards[cardKey(c)]; if(it&&daysSet.has(it.due)) out.push(c); });
  return out;
}
let srsCal={y:null,m:null,pick:null};
function srsOpenCal(){ const n=new Date(); srsCal.y=n.getFullYear(); srsCal.m=n.getMonth(); srsRenderCal(); }
function srsRenderCal(){
  const box=document.getElementById('srsCalBody');
  const y=srsCal.y,m=srsCal.m;
  document.getElementById('srsCalTitle').textContent=new Date(y,m,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  const startDow=(new Date(y,m,1).getDay()+6)%7;
  const dim=new Date(y,m+1,0).getDate();
  const now=new Date();
  let h='';
  for(let i=0;i<startDow;i++) h+='<div class="srs-cal-empty"></div>';
  for(let d=1;d<=dim;d++){
    const dn=Math.floor(new Date(y,m,d).getTime()/86400000);
    const n=srsCountOn(dn);
    let cls='srs-cal-day';
    if(y===now.getFullYear()&&m===now.getMonth()&&d===now.getDate()) cls+=' today';
    if(srsCal.pick===dn) cls+=' picked';
    h+='<div class="'+cls+'" onclick="srsPickDay('+dn+')"><span class="d">'+d+'</span>'+(n>0?'<span class="n">'+n+'</span>':'')+'</div>';
  }
  box.innerHTML=h;
}
function srsPrevMonth(){ srsCal.m--; if(srsCal.m<0){srsCal.m=11;srsCal.y--;} srsRenderCal(); }
function srsNextMonth(){ srsCal.m++; if(srsCal.m>11){srsCal.m=0;srsCal.y++;} srsRenderCal(); }
function srsGoToday(){ const n=new Date(); srsCal.y=n.getFullYear(); srsCal.m=n.getMonth(); srsCal.pick=Math.floor(n.getTime()/86400000); srsRenderCal(); srsShowPick(srsCal.pick,srsCountOn(srsCal.pick)); }
function srsPickDay(d){ srsCal.pick=d; srsRenderCal(); srsShowPick(d,srsCountOn(d)); }
function srsShowPick(d,n){
  const r=document.getElementById('srsDateResult');
  r.innerHTML=n>0 ? srsFmtDate(d)+' · <b>'+n+'</b> tarjetas <button class="srs-mini" onclick="srsRepasarDate('+d+')">Repasar</button>'
    : srsFmtDate(d)+' · sin tarjetas';
}
function srsGoRepasar(cards,title){
  if(cards.length===0){ srsToast('No hay tarjetas para esa fecha.'); return; }
  SRS.reviewMode=true;
  window.state.reviewQueue=cards;
  window.state.cardIndex=0;
  document.getElementById('srsSearchBlock').style.display='none';
  window.renderCard();
}
function srsRepasarDate(d){ srsGoRepasar(srsCardsDueOn(new Set([d])),srsFmtDate(d)); }
function srsMaybeAutoReview(){
  const rd=new URLSearchParams(location.search).get('reviewday');
  if(!rd) return;
  const day=parseInt(rd,10); if(!(day>0)) return;
  srsGoRepasar(srsCardsDueOn(new Set([day])),'Repaso · '+srsFmtDate(day));
}
window.SRS=SRS;
window.srsRate=srsRate; window.srsCustom=srsCustom;
window.srsPrevMonth=srsPrevMonth; window.srsNextMonth=srsNextMonth;
window.srsGoToday=srsGoToday; window.srsPickDay=srsPickDay; window.srsRepasarDate=srsRepasarDate;

let tpEmail = null, tpMods = [];
function tpRefresh(){
  const m = window.currentMod;
  const mi = MODS.find(x=>x.id===m);
  document.getElementById('tpModName').textContent = '模組：' + (mi ? mi.es : m);
  document.getElementById('tpOpenMod').checked = tpMods.includes(m);
}
window.tpRefresh = tpRefresh;
window.applyExtraGrant=function(allowedMods){
  window.fillModSelect(allowedMods);
  const uMod = new URLSearchParams(location.search).get('mod');
  if(allowedMods && allowedMods.length){
    if(uMod && allowedMods.includes(uMod)) window.setMod(uMod);
    else window.setMod(allowedMods[0]);
  } else {
    document.getElementById('cardBox').innerHTML='<div class="empty-note-big">Este modulo aun no esta disponible para tu cuenta.</div>';
  }
};
window.applyExtraTeacher=function(allowedMods){
  window.fillModSelect(MODS);
  const uMod = new URLSearchParams(location.search).get('mod');
  window.setMod(uMod && MODS.some(x=>x.id===uMod) ? uMod : MODS[0].id);
  if(allowedMods) tpRefresh();
};

onAuthStateChanged(auth, async (user)=>{
  if(!user) return;
  const isTeacher = user.email==='blissfulmeow@chino-basico-por-tema.firebaseapp.com';
  if(isTeacher){
    const sp=new URLSearchParams(location.search).get('student');
    document.getElementById('teacherPanel').style.display = sp ? 'block' : 'none';
    let granted = null;
    if(sp){
      tpEmail = sp.trim().toLowerCase().replace(/[^a-z0-9]+/g,'.')+'@chino-basico-por-tema.firebaseapp.com';
      document.getElementById('tpStudentName').textContent = sp;
      try{
        const snap=await getDoc(doc(db,"grants",tpEmail));
        tpMods = (snap.exists() && snap.data().extra && snap.data().extra.mods) || [];
      }catch(e){ tpMods = []; }
      granted = tpMods;
    }
    window.applyExtraTeacher(granted);
    return;
  }
  try{
    const snap=await getDoc(doc(db,"grants",user.email));
    const g=snap.exists()?(snap.data().extra||null):null;
    const mods=(g&&g.mods)?g.mods:[];
    window._allowedMods = mods;
    refreshVisible();
    window.applyExtraGrant(mods);
  }catch(e){ console.warn('grant read fail',e); }
  document.getElementById('srsRow').style.display='block';
  document.getElementById('learnedRow').style.display='none';
  srsLoad(user.email);
});

document.getElementById('saveModBtn').addEventListener('click', async ()=>{
  const stat=document.getElementById('exportStat');
  try{
    if(!auth.currentUser || auth.currentUser.email!=='blissfulmeow@chino-basico-por-tema.firebaseapp.com'){
      stat.textContent='請先以老師帳號登入'; return;
    }
    if(!tpEmail){ stat.textContent='缺少學生參數'; return; }
    const m = window.currentMod;
    const on = document.getElementById('tpOpenMod').checked;
    if(on && !tpMods.includes(m)) tpMods.push(m);
    if(!on) tpMods = tpMods.filter(x=>x!==m);
    await setDoc(doc(db,"grants",tpEmail), { extra:{mods:tpMods, updatedAt:new Date()} }, { merge:true });
    stat.textContent='✓ Guardado: '+tpMods.length+' modulos → '+tpEmail;
  }catch(e){ stat.textContent='Error: '+(e.message||e); }
});
/* 模組切換時同步老師開關 */
(function(){
  const sel = document.getElementById('modSelect');
  const orig = sel.onchange;
  sel.onchange = (e)=>{ if(orig) orig(e); window.tpRefresh && window.tpRefresh(); };
})();

window.MODS = MODS;

}
