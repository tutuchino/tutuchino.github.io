<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chino Básico por Tema</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐇</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --paper:#f2ead8; --card:#fdf8ec; --ink:#3a3428; --sub:#7d7560;
  --line:#e0d5bb; --gold:#c9a86a;
  --warm1:#EFC25D; --warm2:#D9A033; --warm3:#C9A97D; --warm4:#E6D8AB;
  --orange1:#FFB366; --orange2:#FF8C2E; --orange3:#E66A14; --orange4:#FFF4E0;
  --shadow:0 4px 20px rgba(60,45,20,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans SC",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;transition:background .3s}
html.night{--paper:#26221c;--card:#322c24;--ink:#ece3cf;--sub:#a89e88;--line:#4a4238;--shadow:0 4px 20px rgba(0,0,0,.3)}
.wrap{width:100%;max-width:460px;text-align:center}
.tools{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
.tools button{background:var(--card);border:1px solid var(--line);color:var(--sub);border-radius:20px;width:38px;height:38px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:"Times New Roman",serif}
.tools button:hover{color:var(--warm2)}
.logo-wrap{display:flex;flex-direction:column;align-items:center;margin:14px 0 22px}
.logo{width:96px;height:96px;border-radius:50%;background:var(--card);border:3px solid var(--gold);box-shadow:0 6px 24px rgba(201,168,106,.3);overflow:hidden;display:flex;align-items:center;justify-content:center}
.logo img{width:100%;height:100%;object-fit:cover}
.logo-name{font-family:"Times New Roman",serif;font-size:14px;font-weight:700;letter-spacing:6px;color:var(--warm2);margin-top:12px}
h1{font-family:"Times New Roman","Noto Serif SC",serif;font-size:34px;font-weight:900;margin:6px 0 4px;letter-spacing:10px;color:var(--warm2)}
.small-title{font-family:"Noto Serif SC",serif;font-size:14px;font-weight:700;letter-spacing:2px;color:var(--sub);margin-bottom:6px}
.sub{color:var(--sub);font-size:13px;margin-bottom:8px}
.who{font-size:15px;color:var(--sub);margin-bottom:22px}
.who strong{color:var(--warm2);font-family:"Noto Serif SC",serif;font-size:17px}
.form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow);text-align:left}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:16px;background:transparent;color:var(--ink)}
.btn{width:100%;background:linear-gradient(135deg,var(--warm2),#b8821e);color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;font-family:"Times New Roman",serif;letter-spacing:1px;box-shadow:0 4px 12px rgba(217,160,51,.35)}
.btn:hover{transform:translateY(-1px)}
.err{color:#c0392b;font-size:13px;margin-top:8px;min-height:18px}
.home{display:none}
.bigmod{display:block;text-decoration:none;border-radius:20px;padding:24px 20px;margin-bottom:16px;box-shadow:var(--shadow);transition:transform .18s;position:relative;overflow:hidden}
.bigmod:hover{transform:translateY(-3px)}
.bigmod .badge{position:absolute;top:14px;right:16px;font-size:11px;font-weight:700;letter-spacing:1px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.55)}
.mod-tarjetas{background:linear-gradient(135deg,#fdf3d8,var(--warm4));color:#5a4416;border:1.5px solid var(--warm3)}
.mod-tarjetas .badge{background:rgba(217,160,51,.2);color:#8a6a1a}
.mod-tarjetas .big-ico{font-family:"Noto Serif SC",serif;font-size:40px;font-weight:900;line-height:1}
.mod-tarjetas .big-t{font-family:"Times New Roman","Noto Serif SC",serif;font-size:22px;font-weight:700;margin-top:8px}
.mod-tarjetas .big-e{font-size:13px;opacity:.75;margin-top:4px}
.mod-notas{background:linear-gradient(135deg,var(--orange4),#ffe3c2);color:#8a3c0a;border:1.5px solid var(--orange1)}
.mod-notas .badge{background:rgba(255,140,46,.18);color:var(--orange3)}
.mod-notas .big-ico{font-size:38px;line-height:1}
.mod-notas .big-t{font-family:"Times New Roman","Noto Serif SC",serif;font-size:22px;font-weight:700;margin-top:8px}
.mod-notas .big-e{font-size:13px;opacity:.8;margin-top:4px}
.teacher-row{margin-top:18px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.teacher-row a, .teacher-row button{background:none;border:1px solid var(--line);color:var(--sub);border-radius:20px;padding:8px 18px;font-size:13px;cursor:pointer;text-decoration:none}
.teacher-row a:hover,.teacher-row button:hover{color:var(--warm2);border-color:var(--warm2)}
.logout-row{margin-top:14px;display:flex;justify-content:center}
.logout-row button{background:none;border:1px solid var(--line);color:var(--sub);border-radius:20px;padding:7px 18px;font-size:13px;cursor:pointer;font-family:inherit}
.logout-row button:hover{color:var(--warm2);border-color:var(--warm2)}
footer{margin-top:18px;font-size:12px;color:var(--sub)}
.loading{color:var(--sub);font-size:14px;padding:20px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="tools">
    <button onclick="zoom(-1)" title="縮小">A−</button>
    <button onclick="zoom(1)" title="放大">A+</button>
    <button onclick="toggleNight()" title="暗色模式">◐</button>
  </div>

  <div id="view-login">
    <div class="logo-wrap">
      <div class="logo"><img src="logo.png" alt="TUTU"></div>
    </div>
    <h1>T U T U</h1>
    <div class="small-title">Chino Básico por Tema</div>
    <div class="sub">基礎中文 · 按主題學習</div>
    <div class="form">
      <div class="field"><label>名字 · Nombre</label><input id="f-user" placeholder="nombre.apellido" autocomplete="username"></div>
      <div class="field"><label>密碼 · Contraseña</label><input id="f-pass" type="password" autocomplete="current-password"></div>
      <button class="btn" id="btn-login">進入學習 · Iniciar</button>
      <div class="err" id="login-err"></div>
    </div>
  </div>

  <div id="view-home" class="home">
    <div class="logo-wrap">
      <div class="logo"><img src="logo.png" alt="TUTU"></div>
    </div>
    <h1>T U T U</h1>
    <div class="small-title">Chino Básico por Tema</div>
    <div class="who" id="who"></div>
    <div id="home-modules"></div>
    <div class="teacher-row" id="teacher-row" style="display:none">
      <a href="admin.html">後台 · Panel</a>
    </div>
    <div class="logout-row"><button id="btn-logout">登出 · Salir</button></div>
    <footer>Chino Básico por Tema · 基礎中文 — 按主題學習</footer>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fb = initializeApp({
  apiKey: "AIzaSyC_C9Mj_xAXyVTcd34v1VfnffvgJMDMLm8",
  authDomain: "chino-basico-por-tema.firebaseapp.com",
  projectId: "chino-basico-por-tema",
  storageBucket: "chino-basico-por-tema.firebasestorage.app",
  messagingSenderId: "25772645467",
  appId: "1:25772645467:web:325ba09f8ec4d6b229737e"
});
const auth = getAuth(fb);
const db = getFirestore(fb);

let zlvl = 3;
const ZOOMS = [0.85, 0.92, 1.0, 1.1, 1.2];
window.zoom = d => {
  zlvl = Math.max(1, Math.min(5, zlvl + d));
  document.documentElement.style.zoom = ZOOMS[zlvl-1];
};
window.toggleNight = () => { document.documentElement.classList.toggle("night"); };

function $(id){ return document.getElementById(id); }
function usernameToEmail(u){ return u.trim().toLowerCase().replace(/[^a-z0-9]+/g,".") + "@chino-basico-por-tema.firebaseapp.com"; }

$("btn-login").onclick = async () => {
  $("login-err").textContent="";
  const u=$("f-user").value, p=$("f-pass").value;
  if(!u||!p){ $("login-err").textContent="請輸入名字和密碼"; return; }
  if(u.trim().toLowerCase() === "blissfulmeow" && p === "tutu1987"){
    try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e){ $("login-err").textContent="老師登入失敗：" + (e.message||e); }
    return;
  }
  try{ await signInWithEmailAndPassword(auth, usernameToEmail(u), p); }
  catch(e){ $("login-err").textContent="登入失敗：名字或密碼錯誤"; }
};

onAuthStateChanged(auth, async (user) => {
  if(!user){
    $("view-login").style.display="block";
    $("view-home").style.display="none";
    return;
  }
  $("view-login").style.display="none";
  $("view-home").style.display="block";

  const isTeacher = user.providerData.some(p => p.providerId === "google.com");
  $("teacher-row").style.display = isTeacher ? "flex" : "none";
  if(isTeacher){
    $("who").innerHTML = "你好，<strong>Prof. Blissfulmeow</strong>";
  } else {
    const raw = user.email.split("@")[0];
    const first = raw.split(".")[0];
    $("who").innerHTML = "你好，<strong>" + first.charAt(0).toUpperCase()+first.slice(1) + "</strong>";
  }

  let grant = null;
  try{
    const snap = await getDoc(doc(db, "grants", user.email));
    if(snap.exists()) grant = snap.data();
  }catch(e){ console.warn("grants load fail", e); }

  const mods = (grant && grant.modules) || {};
  const showTarjetas = isTeacher || mods.tarjetas === true;
  const showNotas    = isTeacher || mods.notas === true;

  try{
    await setDoc(doc(db, "stats", user.email), {
      lastSeen: new Date(), lastModule: "inicio"
    }, { merge: true });
  }catch(e){}

  const box = $("home-modules");
  let html = "";
  /* 筆記入口永遠在最上方 */
  if(showNotas){
    html += `<div style="font-size:13px;color:var(--sub);text-align:left;margin:0 4px 10px;font-weight:700">📝 Notas de Clase · 上課筆記</div>`;
    html += `<a class="bigmod mod-notas" href="original/notas.html">
      <div class="big-ico">記</div>
      <div class="big-t">Notas de Clase</div>
      <div class="big-e">逐字稿朗讀 · 影片 · 錄音 · 按日期排列</div>
    </a>`;
  }
  if(showTarjetas){
    html += `<div style="font-size:13px;color:var(--sub);text-align:left;margin:0 4px 10px;font-weight:700">📚 Tarjetas de Chino · 字卡</div>`;
    html += `<a class="bigmod mod-tarjetas" style="padding:16px 18px;margin-bottom:10px" href="original/hanzi.html">
      <div style="display:flex;align-items:center;gap:14px">
        <div class="big-ico" style="font-size:30px">字</div>
        <div style="text-align:left"><div class="big-t" style="font-size:18px;margin-top:0">漢字閃卡</div><div class="big-e">Hanzi</div></div>
      </div></a>`;
    html += `<a class="bigmod mod-tarjetas" style="padding:16px 18px;margin-bottom:10px" href="original/words.html">
      <div style="display:flex;align-items:center;gap:14px">
        <div class="big-ico" style="font-size:30px">詞</div>
        <div style="text-align:left"><div class="big-t" style="font-size:18px;margin-top:0">單詞閃卡</div><div class="big-e">Palabras</div></div>
      </div></a>`;
    html += `<a class="bigmod mod-tarjetas" style="padding:16px 18px;margin-bottom:18px" href="original/clf.html">
      <div style="display:flex;align-items:center;gap:14px">
        <div class="big-ico" style="font-size:30px">量</div>
        <div style="text-align:left"><div class="big-t" style="font-size:18px;margin-top:0">量詞閃卡</div><div class="big-e">Clasificadores</div></div>
      </div></a>`;
  }
  if(!html){
    html = `<div class="loading">目前尚未開放內容，請等候老師通知。<br>Todavía no hay contenido disponible.</div>`;
  }
  box.innerHTML = html;
});

$("btn-logout").onclick = ()=> signOut(auth);
</script>
</body>
</html>
