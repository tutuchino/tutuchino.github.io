<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chino Básico por Tema</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{--paper:#f2ead8;--card:#fdf8ec;--ink:#3a3428;--sub:#7d7560;--accent:#8a6d3b;--accent-dark:#6b5328;--border:#e0d5bb;--shadow:0 4px 20px rgba(60,45,20,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans SC",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:440px;text-align:center}
/* Logo */
.logo-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:20px}
.logo{width:90px;height:90px;border-radius:50%;background:var(--card);border:2px solid var(--border);box-shadow:var(--shadow);overflow:hidden;display:flex;align-items:center;justify-content:center}
.logo img{width:100%;height:100%;object-fit:cover}
.logo-name{font-family:"Noto Serif SC",serif;font-size:14px;font-weight:700;letter-spacing:3px;color:var(--accent);margin-top:8px}
h1{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:900;margin-bottom:4px;letter-spacing:1px}
.sub{color:var(--sub);font-size:14px;margin-bottom:28px}
/* 登入表單 */
.form{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:var(--shadow);text-align:left}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.field input{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:16px;background:transparent;color:var(--ink)}
.btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
.btn:hover{background:var(--accent-dark)}
.err{color:#c0392b;font-size:13px;margin-top:8px;min-height:18px}
/* 首頁 */
.home{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.topbar button{background:none;border:1px solid var(--border);color:var(--sub);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer}
.who{font-size:16px;margin-bottom:24px;text-align:center;color:var(--sub)}
.who strong{color:var(--ink);font-family:"Noto Serif SC",serif}
.mod{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:12px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s}
.mod:hover{transform:translateY(-3px)}
.mod .ico{width:52px;height:52px;border-radius:12px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--accent);flex-shrink:0}
.mod .txt{text-align:left}
.mod .t{font-family:"Noto Serif SC",serif;font-size:17px;font-weight:700}
.mod .e{font-size:13px;color:var(--sub)}
footer{margin-top:28px;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <div id="view-login">
    <div class="logo-wrap">
      <div class="logo"><img src="logo.png" alt="TUTU"></div>
      <div class="logo-name">T U T U</div>
    </div>
    <h1>Chino Básico por Tema</h1>
    <div class="sub">基礎中文 · 按主題學習</div>
    <div class="form">
      <div class="field"><label>名字 · Nombre</label><input id="f-user" placeholder="nombre.apellido"></div>
      <div class="field"><label>密碼 · Contraseña</label><input id="f-pass" type="password"></div>
      <button class="btn" id="btn-login">進入學習 · Iniciar</button>
      <div class="err" id="login-err"></div>
    </div>
  </div>
  <div id="view-home" class="home">
    <div class="logo-wrap" style="margin-bottom:12px">
      <div class="logo" style="width:64px;height:64px"><img src="logo.png" alt="TUTU"></div>
      <div class="logo-name" style="font-size:12px">T U T U</div>
    </div>
    <h1 style="font-size:22px">Chino Básico por Tema</h1>
    <div class="who" id="who"></div>
    <a class="mod" href="original/hanzi.html"><div class="ico">字</div><div class="txt"><div class="t">漢字閃卡</div><div class="e">Hanzi · 4,475 字</div></div></a>
    <a class="mod" href="original/words.html"><div class="ico">詞</div><div class="txt"><div class="t">單詞閃卡</div><div class="e">Palabras · 11,781 詞</div></div></a>
    <a class="mod" href="original/clf.html"><div class="ico">量</div><div class="txt"><div class="t">量詞閃卡</div><div class="e">Clasificadores · 258 個</div></div></a>
    <div class="topbar" style="margin-top:20px"><span></span><button id="btn-logout">登出 · Salir</button></div>
    <footer>Chino Básico por Tema · 基礎中文 — 按主題學習</footer>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyC_C9Mj_xAXyVTcd34v1VfnffvgJMDMLm8",
  authDomain: "chino-basico-por-tema.firebaseapp.com",
  projectId: "chino-basico-por-tema",
  storageBucket: "chino-basico-por-tema.firebasestorage.app",
  messagingSenderId: "25772645467",
  appId: "1:25772645467:web:325ba09f8ec4d6b229737e"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
function usernameToEmail(u){ return u.trim().toLowerCase().replace(/[^a-z0-9]+/g,".") + "@chino-basico-por-tema.firebaseapp.com"; }
$("btn-login").onclick = async () => {
  $("login-err").textContent="";
  const u=$("f-user").value, p=$("f-pass").value;
  if(!u||!p){ $("login-err").textContent="請輸入名字和密碼"; return; }
  try{ await signInWithEmailAndPassword(auth, usernameToEmail(u), p); }
  catch(e){ $("login-err").textContent="登入失敗：名字或密碼錯誤"; }
};
onAuthStateChanged(auth, user => {
  if(user){
    const raw = user.email.split("@")[0];
    $("who").innerHTML = "你好，<strong>" + raw.split(".")[0].charAt(0).toUpperCase() + raw.split(".")[0].slice(1) + "</strong>";
    $("view-login").style.display="none";
    $("view-home").style.display="block";
  } else {
    $("view-login").style.display="block";
    $("view-home").style.display="none";
  }
});
$("btn-logout").onclick = ()=> signOut(auth);
function $(id){ return document.getElementById(id); }
</script>
</body>
</html>
