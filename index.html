<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chino Básico por Tema</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --paper:#f2ead8;--card:#fdf8ec;--ink:#3a3428;--sub:#7d7560;
  --accent:#8a6d3b;--accent-dark:#6b5328;--border:#e0d5bb;
  --shadow:0 4px 20px rgba(60,45,20,.1);
  --gold:#c9a86a;--rose:#c4756a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans SC",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;transition:background .3s}
html.night{--paper:#26221c;--card:#322c24;--ink:#ece3cf;--sub:#a89e88;--accent:#c9a86a;--accent-dark:#c9a86a;--border:#4a4238;--shadow:0 4px 20px rgba(0,0,0,.3)}
.wrap{width:100%;max-width:440px;text-align:center}
/* 頂部工具列 */
.tools{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
.tools button{background:var(--card);border:1px solid var(--border);color:var(--sub);border-radius:20px;width:36px;height:36px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tools button:hover{color:var(--accent)}
/* Logo */
.logo-wrap{display:flex;flex-direction:column;align-items:center;margin:16px 0 28px}
.logo{width:88px;height:88px;border-radius:50%;background:var(--card);border:2px solid var(--gold);box-shadow:0 4px 20px rgba(201,168,106,.25);overflow:hidden;display:flex;align-items:center;justify-content:center}
.logo img{width:100%;height:100%;object-fit:cover}
.logo-name{font-family:"Noto Serif SC",serif;font-size:13px;font-weight:700;letter-spacing:4px;color:var(--accent);margin-top:10px}
h1{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;margin-bottom:6px;letter-spacing:1px}
.sub{color:var(--sub);font-size:14px;margin-bottom:8px}
.who{font-size:15px;color:var(--sub);margin-bottom:28px}
.who strong{color:var(--accent);font-family:"Noto Serif SC",serif;font-size:17px}
/* 登入表單 */
.form{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:var(--shadow);text-align:left}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.field input{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:16px;background:transparent;color:var(--ink)}
.btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
.btn:hover{background:var(--accent-dark)}
.err{color:#c0392b;font-size:13px;margin-top:8px;min-height:18px}
/* 模組卡片 */
.home{display:none}
.mod{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.mod:hover{transform:translateY(-3px);border-color:var(--gold)}
.mod .ico{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;flex-shrink:0}
.mod:nth-child(1) .ico{background:rgba(138,109,59,.12);color:var(--accent)}
.mod:nth-child(2) .ico{background:rgba(196,117,106,.12);color:var(--rose)}
.mod:nth-child(3) .ico{background:rgba(100,130,100,.12);color:#6b8e6b}
.mod .txt{text-align:left;flex:1}
.mod .t{font-family:"Noto Serif SC",serif;font-size:17px;font-weight:700}
.mod .e{font-size:13px;color:var(--sub);margin-top:2px}
.logout-row{margin-top:28px;display:flex;justify-content:center}
.logout-row button{background:none;border:1px solid var(--border);color:var(--sub);border-radius:20px;padding:7px 18px;font-size:13px;cursor:pointer}
footer{margin-top:16px;font-size:12px;color:var(--sub)}
/* 字體縮放 */
/* 字體縮放 */
html{zoom:1}
</style>
</head>
<body class="zoom-3">
<div class="wrap">
  <div class="tools">
    <button onclick="zoom(-1)" title="縮小">A-</button>
    <button onclick="zoom(1)" title="放大">A+</button>
    <button onclick="toggleNight()" id="night-btn" title="夜間模式">◐</button>
  </div>

  <div id="view-login">
    <div class="logo-wrap">
      <div class="logo"><img src="logo.png" alt="TUTU"></div>
      <div class="logo-name">T U T U</div>
    </div>
    <h1>Chino Básico por Tema</h1>
    <div class="sub">基礎中文 · 按主題學習</div>
    <div class="form">
      <div class="field"><label>名字 · Nombre</label><input id="f-user" placeholder="nombre.apellido"></div>
      <div class="field"><label>密碼 · Contraseña</label><input id="f-pass" type="password"></div>
      <button class="btn" id="btn-login">進入學習 · Iniciar</button>
      <div class="err" id="login-err"></div>
    </div>
  </div>

  <div id="view-home" class="home">
    <div class="logo-wrap">
      <div class="logo"><img src="logo.png" alt="TUTU"></div>
      <div class="logo-name">T U T U</div>
    </div>
    <h1>Chino Básico por Tema</h1>
    <div class="who" id="who"></div>
    <a class="mod" href="original/hanzi.html"><div class="ico">字</div><div class="txt"><div class="t">漢字閃卡</div><div class="e">Hanzi · 4,475 字</div></div></a>
    <a class="mod" href="original/words.html"><div class="ico">詞</div><div class="txt"><div class="t">單詞閃卡</div><div class="e">Palabras · 11,781 詞</div></div></a>
    <a class="mod" href="original/clf.html"><div class="ico">量</div><div class="txt"><div class="t">量詞閃卡</div><div class="e">Clasificadores · 258 個</div></div></a>
    <div class="logout-row"><button id="btn-logout">登出 · Salir</button></div>
    <footer id="hidden-door" style="cursor:default;">Chino Básico por Tema · 基礎中文 — 按主題學習</footer>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyC_C9Mj_xAXyVTcd34v1VfnffvgJMDMLm8",
  authDomain: "chino-basico-por-tema.firebaseapp.com",
  projectId: "chino-basico-por-tema",
  storageBucket: "chino-basico-por-tema.firebasestorage.app",
  messagingSenderId: "25772645467",
  appId: "1:25772645467:web:325ba09f8ec4d6b229737e"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
/* 字體縮放 */
let zlvl = 3;
const ZOOMS = [0.85, 0.92, 1.0, 1.1, 1.2];
window.zoom = d => {
  zlvl = Math.max(1, Math.min(5, zlvl + d));
  document.documentElement.style.zoom = ZOOMS[zlvl-1];
};
/* 夜間模式 */
window.toggleNight = () => {
  document.documentElement.classList.toggle("night");
};
function usernameToEmail(u){ return u.trim().toLowerCase().replace(/[^a-z0-9]+/g,".") + "@chino-basico-por-tema.firebaseapp.com"; }
$("btn-login").onclick = async () => {
  $("login-err").textContent="";
  const u=$("f-user").value, p=$("f-pass").value;
  if(!u||!p){ $("login-err").textContent="請輸入名字和密碼"; return; }
  try{ await signInWithEmailAndPassword(auth, usernameToEmail(u), p); }
  catch(e){ $("login-err").textContent="登入失敗：名字或密碼錯誤"; }
};
onAuthStateChanged(auth, user => {
  if(user){
    const raw = user.email.split("@")[0];
    $("who").innerHTML = "你好，<strong>" + raw.split(".")[0].charAt(0).toUpperCase() + raw.split(".")[0].slice(1) + "</strong>";
    $("view-login").style.display="none";
    $("view-home").style.display="block";
  } else {
    $("view-login").style.display="block";
    $("view-home").style.display="none";
  }
});
/* 隱藏老師入口：連點底部 5 次，或網址加 ?admin */
const TEACHER_CODE = "tutu2026";
let doorCount = 0;
const doorEl = $("hidden-door");
if(doorEl){
  doorEl.addEventListener("click", () => {
    doorCount++;
    if(doorCount >= 5){ doorCount = 0; showTeacherBox(); }
  });
}
if(new URLSearchParams(location.search).get("admin") === "1") showTeacherBox();
function showTeacherBox(){
  $("teacher-box").style.display = "block";
  $("f-teacher").focus();
}
$("btn-teacher").onclick = async () => {
  $("teacher-err").textContent="";
  const c = $("f-teacher").value.trim();
  if(c !== TEACHER_CODE){ $("teacher-err").textContent="Código incorrecto"; return; }
  try{ await signInWithPopup(auth, new GoogleAuthProvider()); $("teacher-box").style.display="none"; }
  catch(e){ $("teacher-err").textContent="登入失敗：" + (e.message||e); }
};
$("btn-logout").onclick = ()=> signOut(auth);
function $(id){ return document.getElementById(id); }
</script>
</body>
</html>
