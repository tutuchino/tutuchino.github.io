<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chino Básico por Tema</title>
<style>
:root{--paper:#f2ead8;--card:#fdf8ec;--ink:#3a3428;--sub:#7d7560;--accent:#8a6d3b;--border:#e0d5bb;--shadow:0 4px 16px rgba(60,45,20,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans SC",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
html.night{--paper:#26221c;--card:#322c24;--ink:#ece3cf;--sub:#a89e88;--accent:#c9a86a;--border:#4a4238;--shadow:0 4px 16px rgba(0,0,0,.3)}
.wrap{width:100%;max-width:420px;text-align:center}
.logo{width:80px;height:80px;border-radius:50%;background:var(--card);border:1px solid var(--border);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
h1{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;margin-bottom:4px}
.sub{color:var(--sub);font-size:14px;margin-bottom:24px}
.form{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:var(--shadow);text-align:left}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.field input{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:16px;background:transparent;color:var(--ink)}
.btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
.err{color:#c0392b;font-size:13px;margin-top:8px;min-height:18px}
.home{display:none}
.mod{display:block;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .1s}
.mod:hover{transform:translateY(-2px)}
.mod .ico{font-size:28px;margin-bottom:6px}
.mod .t{font-family:"Noto Serif SC",serif;font-size:18px;font-weight:700}
.mod .e{font-size:13px;color:var(--sub)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.topbar button{background:none;border:1px solid var(--border);color:var(--ink);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer}
.who{font-size:15px;margin-bottom:16px;text-align:left}
footer{margin-top:24px;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <div id="view-login">
    <div class="logo">🐰</div>
    <h1>Chino Básico por Tema</h1>
    <div class="sub">基礎中文 · 按主題學習</div>
    <div class="form">
      <div class="field"><label>名字 · Nombre</label><input id="f-user" placeholder="nombre.apellido"></div>
      <div class="field"><label>密碼 · Contraseña</label><input id="f-pass" type="password"></div>
      <button class="btn" id="btn-login">進入學習 · Iniciar</button>
      <div class="err" id="login-err"></div>
    </div>
  </div>
  <div id="view-home" class="home">
    <div class="topbar">
      <strong>Chino Básico por Tema</strong>
      <button id="btn-logout">登出</button>
    </div>
    <div class="who" id="who"></div>
    <a class="mod" href="original/hanzi.html"><div class="ico">字</div><div class="t">漢字閃卡</div><div class="e">Hanzi</div></a>
    <a class="mod" href="original/words.html"><div class="ico">詞</div><div class="t">單詞閃卡</div><div class="e">Palabras</div></a>
    <a class="mod" href="original/clf.html"><div class="ico">量</div><div class="t">量詞閃卡</div><div class="e">Clasificadores</div></a>
    <footer>Chino Básico por Tema · 基礎中文 — 按主題學習</footer>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyC_C9Mj_xAXyVTcd34v1VfnffvgJMDMLm8",
  authDomain: "chino-basico-por-tema.firebaseapp.com",
  projectId: "chino-basico-por-tema",
  storageBucket: "chino-basico-por-tema.firebasestorage.app",
  messagingSenderId: "25772645467",
  appId: "1:25772645467:web:325ba09f8ec4d6b229737e"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
function usernameToEmail(u){ return u.trim().toLowerCase().replace(/[^a-z0-9]+/g,".") + "@chino-basico-por-tema.firebaseapp.com"; }
$("btn-login").onclick = async () => {
  $("login-err").textContent="";
  const u=$("f-user").value, p=$("f-pass").value;
  if(!u||!p){ $("login-err").textContent="請輸入名字和密碼"; return; }
  try{ await signInWithEmailAndPassword(auth, usernameToEmail(u), p); }
  catch(e){ $("login-err").textContent="登入失敗：名字或密碼錯誤"; }
};
onAuthStateChanged(auth, user => {
  if(user){
    const raw = user.email.split("@")[0];
    $("who").textContent = "你好，" + raw.split(".")[0].charAt(0).toUpperCase() + raw.split(".")[0].slice(1);
    $("view-login").style.display="none";
    $("view-home").style.display="block";
  } else {
    $("view-login").style.display="block";
    $("view-home").style.display="none";
  }
});
$("btn-logout").onclick = ()=> signOut(auth);
function $(id){ return document.getElementById(id); }
</script>
</body>
</html>
